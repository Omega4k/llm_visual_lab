<!doctype html>
<meta charset="utf-8">
<title>Level visibility test</title>
<!--
  Manual/headless check for one-lesson views + additive knowledge levels.
  Serve the project root (python -m http.server 8000), then open
  http://localhost:8000/tests/level-visibility.html — or run headless:
    chrome --headless --dump-dom http://localhost:8000/tests/level-visibility.html
  Pass = document.title is "PASS" and every line below says ok.
-->
<iframe id="f" src="/" width="1000" height="800"></iframe>
<pre id="out">running…</pre>
<script>
document.getElementById("f").addEventListener("load", async () => {
  const doc = document.getElementById("f").contentDocument;
  const win = document.getElementById("f").contentWindow;
  win.localStorage.clear();
  const lines = [];
  let failures = 0;
  function check(name, cond) {
    lines.push((cond ? "ok   " : "FAIL ") + name);
    if (!cond) failures++;
  }
  function visible(el) {
    // Measure the rendered text, not the box: an element whose text is
    // display:none still has a (collapsing) box, so check a Range over
    // its contents for a non-empty rect.
    if (!el || getComputedStyle(el).display === "none") return false;
    const r = doc.createRange();
    r.selectNodeContents(el);
    return [...r.getClientRects()].some((rect) => rect.width > 0 && rect.height > 0);
  }
  const sleep = (ms) => new Promise((res) => setTimeout(res, ms));
  const VIEWS = ["tokens", "embeddings", "training", "attention", "probabilities",
    "journey", "parsing", "toymodel", "context", "limits", "playground", "scaling",
    "assistant", "rag", "capstone"];
  const expectedAdds = { beginner: [], medium: ["m"], expert: ["m", "e"] };

  // The Introduction is a view, but not a counted lesson.
  doc.querySelector('.lesson-nav a[href="#intro"]').click();
  check("intro: shown on its sidebar link",
    [...doc.querySelectorAll("main > section.panel")]
      .filter((s) => getComputedStyle(s).display !== "none").map((s) => s.id).join(",") === "intro");
  check("intro: four chapter cards and four sidebar groups",
    doc.querySelectorAll("#intro .chapter-card").length === 4 &&
    doc.querySelectorAll(".sidebar-group").length === 4);
  doc.querySelector("#intro .begin-btn").click();
  await sleep(300); // the Begin link works via hashchange, which is async
  check("intro: Begin button opens Lesson 1",
    [...doc.querySelectorAll("main > section.panel")]
      .filter((s) => getComputedStyle(s).display !== "none").map((s) => s.id).join(",") === "tokens");

  for (const id of VIEWS) {
    doc.querySelector('.lesson-nav a[href="#' + id + '"]').click();
    const active = [...doc.querySelectorAll("main > section.panel")]
      .filter((s) => getComputedStyle(s).display !== "none").map((s) => s.id);
    check(id + ": only this lesson is shown", active.join(",") === id);
    check(id + ": sidebar marks it active",
      doc.querySelector('.lesson-nav a[href="#' + id + '"]').classList.contains("active"));
    for (const level of ["beginner", "medium", "expert"]) {
      doc.querySelector('[data-set-level="' + level + '"]').click();
      const sec = doc.getElementById(id);
      check(level + " " + id + ": base text visible", visible(sec.querySelector(":scope > p")));
      const adds = [...sec.querySelectorAll(".lvl-add")];
      const want = expectedAdds[level];
      check(level + " " + id + ": shows adds [" + want + "] (" + adds.length + " blocks)",
        adds.length > 0 && adds.every((el) =>
          visible(el) === want.some((w) => el.classList.contains("lvl-add-" + w))));
    }
  }

  // Model picker in the header.
  const modelSel = doc.getElementById("modelSelect");
  check("model picker exists with the default model",
    !!modelSel && [...modelSel.options].some((o) => o.value === "llama3.2:1b"));
  modelSel.value = "llama3.2:1b";
  modelSel.dispatchEvent(new win.Event("change"));
  check("model picker persists the choice",
    win.localStorage.getItem("llmLabModel") === "llama3.2:1b" &&
    doc.getElementById("statusText").textContent.includes("llama3.2:1b"));

  // Settings live in the sidebar, not a top bar.
  const sidebarEl = doc.getElementById("sidebar");
  check("no top sticky bar remains", !doc.querySelector(".sticky-bar"));
  check("level/sound/theme/quiz controls are inside the sidebar",
    ["[data-set-level='expert']", "#soundBtn", "#themeSelect", "#quizOpenBtn"]
      .every((sel) => sidebarEl.contains(doc.querySelector(sel))));
  check("every sidebar lesson button fits on one line",
    [...doc.querySelectorAll(".lesson-nav a")].every((a) => {
      const r = doc.createRange();
      r.selectNodeContents(a);
      return [...r.getClientRects()].length <= 1 && a.scrollWidth <= a.clientWidth + 1;
    }));
  const lvlBtns = [...doc.querySelectorAll(".level-btns .level-btn")];
  check("level buttons form one group on a single row",
    lvlBtns.length === 3 &&
    lvlBtns.every((b) => b.offsetTop === lvlBtns[0].offsetTop));
  doc.getElementById("soundBtn").click();
  check("sound toggle works from sidebar",
    doc.getElementById("soundBtn").getAttribute("aria-pressed") === "true");
  doc.getElementById("soundBtn").click();
  const themeSel = doc.getElementById("themeSelect");
  themeSel.value = "ice";
  themeSel.dispatchEvent(new win.Event("change"));
  check("theme switch works from sidebar", doc.body.classList.contains("theme-ice"));
  themeSel.value = "amber";
  themeSel.dispatchEvent(new win.Event("change"));
  doc.getElementById("quizOpenBtn").click();
  check("quiz drawer opens from sidebar",
    doc.getElementById("quizDrawer").classList.contains("open"));
  doc.getElementById("quizCloseBtn").click();

  // Merged lesson 10: no separate showcase, journey lives in the playground,
  // and the debug panel is Expert-only.
  check("showcase view is gone", !doc.getElementById("showcase"));
  doc.querySelector('.lesson-nav a[href="#playground"]').click();
  check("journey 3D lives inside lesson 10",
    doc.getElementById("playground").contains(doc.getElementById("journeyLive3D")));
  const dbg = doc.querySelector(".expert-debug");
  check("debug panel exists inside lesson 10",
    !!dbg && doc.getElementById("playground").contains(dbg));
  for (const [level, want] of [["beginner", false], ["medium", false], ["expert", true]]) {
    doc.querySelector('[data-set-level="' + level + '"]').click();
    check(level + ": debug panel " + (want ? "shown" : "hidden"), visible(dbg) === want);
  }
  check("model card moved into debug panel", dbg.contains(doc.getElementById("modelCard")));
  doc.querySelector('[data-set-level="beginner"]').click();

  // New interactive graphics.
  doc.querySelector('.lesson-nav a[href="#tokens"]').click();
  check("tokens: echo line mirrors the chips",
    doc.querySelectorAll("#tokenEcho .echo-tok").length > 0 &&
    doc.querySelectorAll("#tokenRow .token").length > 0);
  doc.querySelector(".preset-btn").click();
  check("tokens: surprise preset fills the input",
    doc.getElementById("tokenInput").value.includes("Antidisestablishmentarianism"));
  doc.querySelector('.lesson-nav a[href="#journey"]').click();
  check("journey: sharpening chart explains itself",
    doc.getElementById("sharpNote").textContent.includes("layer 0") &&
    doc.getElementById("sharpNote").textContent.includes("layer 15"));
  doc.querySelector('.lesson-nav a[href="#training"]').click();
  const stepToBottom = () => {
    for (let i = 0; i < 90; i++) {
      doc.getElementById("lossStepBtn").click();
      if (doc.getElementById("lossMath").textContent.includes("convergence")) break;
    }
    return doc.getElementById("lossMath").textContent;
  };
  doc.querySelector('[data-loss-start="-2.4,2.0"]').click();
  check("training: west start converges to the west LOCAL dip",
    stepToBottom().includes("west dip"));
  doc.querySelector('[data-loss-start="0.2,2.6"]').click();
  check("training: north start converges to the GLOBAL dip",
    stepToBottom().includes("GLOBAL minimum"));
  doc.getElementById("lossResetBtn").click();
  doc.querySelector('.lesson-nav a[href="#parsing"]').click();
  check("parsing: word-role chips rendered",
    doc.querySelectorAll("#parseTokens .parse-word").length >= 10);
  doc.querySelector('[data-stage="2"]').click();
  check("parsing: stage 2 reveals links",
    doc.querySelectorAll("#parseLinks .attn-weight").length >= 2);
  doc.querySelector('[data-stage="3"]').click();
  check("parsing: stage 3 reveals the interpreted request",
    !doc.getElementById("parseSummary").hidden &&
    doc.getElementById("parseSummary").textContent.includes("count"));
  doc.getElementById("parseSelect").value = "4";
  doc.getElementById("parseSelect").dispatchEvent(new win.Event("change"));
  check("parsing: ambiguity preset changes the summary",
    doc.getElementById("parseSummary").textContent.includes("flies"));
  doc.querySelector('[data-stage="1"]').click();
  doc.querySelector('.lesson-nav a[href="#context"]').click();
  doc.getElementById("ctxAddBtn").click();
  doc.getElementById("ctxAddBtn").click();
  doc.getElementById("ctxAddBtn").click();
  check("context: overflow shows the just-forgotten tokens",
    !doc.getElementById("ctxGhostRow").hidden &&
    doc.getElementById("ctxGhost").textContent.length > 0 &&
    doc.querySelectorAll("#ctxWindow .ctx-risk").length > 0);
  doc.getElementById("ctxResetBtn").click();
  doc.querySelector('.lesson-nav a[href="#limits"]').click();
  const predBtn = doc.querySelector('[data-trap-row="maths"] .trap-pred[data-pred="fall"]');
  predBtn.click();
  check("limits: prediction locks in on the scoreboard",
    predBtn.classList.contains("active"));
  doc.getElementById("trapResetBtn").click();
  check("limits: scoreboard resets",
    !predBtn.classList.contains("active") &&
    doc.getElementById("trapTally").textContent.includes("0 of 0"));
  const scaleLink = doc.querySelector('.lesson-nav a[href="#scaling"]');
  scaleLink.scrollIntoView();
  const lr = scaleLink.getBoundingClientRect();
  check("scaling: sidebar link is actually hit-testable (not covered/clipped)",
    doc.elementFromPoint(lr.left + lr.width / 2, lr.top + lr.height / 2) === scaleLink);
  scaleLink.click();
  check("scaling: comparison table present",
    doc.querySelectorAll("#scaling .compare-table tbody tr").length >= 6);
  const noteBefore = doc.getElementById("scaleNote").textContent;
  check("scaling: parameters shown at true volume scale",
    noteBefore.includes("TRUE volume scale") && noteBefore.includes("200"));
  doc.querySelector('[data-metric="context"]').click();
  check("scaling: metric switch updates the explanation",
    doc.getElementById("scaleNote").textContent.includes("Context window") &&
    doc.getElementById("scaleNote").textContent !== noteBefore);

  doc.querySelector('.lesson-nav a[href="#assistant"]').click();
  doc.querySelector('[data-pipe="2"]').click();
  check("assistant: pipeline stage 3 explains preference training",
    doc.getElementById("pipeDetail").textContent.includes("Preference training"));
  check("assistant: base vs assistant outputs differ",
    doc.getElementById("baseOut").textContent.length > 10 &&
    doc.getElementById("assistantOut").textContent.includes("Paris"));
  doc.querySelector('.lesson-nav a[href="#rag"]').click();
  doc.getElementById("ragSearchBtn").click();
  check("rag: search ranks the lighthouse chunk first",
    doc.querySelector("#ragResults .cand-bar .cand-name").textContent === "chunk 1");
  doc.getElementById("ragBuildBtn").click();
  check("rag: stuffed prompt contains evidence and question",
    !doc.getElementById("ragPrompt").hidden &&
    doc.getElementById("ragPrompt").textContent.includes("lighthouse") &&
    doc.getElementById("ragAnswer").textContent.includes("Bright red"));
  doc.querySelector('.lesson-nav a[href="#capstone"]').click();
  doc.getElementById("capResetBtn").click();
  doc.querySelector('[data-cap-pred="fall"]').click();
  check("capstone: prediction ticks step 1",
    doc.querySelector('[data-cap="predict"]').classList.contains("done") &&
    doc.getElementById("capTally").textContent.includes("1 of 5"));
  doc.getElementById("capResetBtn").click();

  // Icons + completion state (sidebar masks, button icons, nav check).
  check("icons: every sidebar link has an SVG mask icon and a check span",
    [...doc.querySelectorAll(".lesson-nav a")].every((a) =>
      a.style.getPropertyValue("--nav-icon").includes("data:image/svg+xml") &&
      !!a.querySelector(".nav-check")));
  check("icons: action buttons carry an inline SVG icon",
    ["generateBtn", "ragSearchBtn", "capRunBtn"].every((id) =>
      !!doc.getElementById(id).querySelector(".btn-icon svg")));
  check("icons: sound button shows icon plus current state label",
    !!doc.getElementById("soundBtn").querySelector("svg") &&
    doc.getElementById("soundBtn").textContent.includes("Sound:"));
  doc.querySelector('.lesson-nav a[href="#tokens"]').click();
  const completeBtn = doc.querySelector('.complete-btn[data-lesson="tokens"]');
  const tokensCheck = doc.querySelector('.lesson-nav a[href="#tokens"] .nav-check');
  completeBtn.click();
  check("complete: label switches and sidebar check appears",
    completeBtn.querySelector(".btn-label").textContent.includes("Completed") &&
    completeBtn.classList.contains("is-complete") && tokensCheck.hidden === false);
  completeBtn.click();
  check("complete: second click undoes label and sidebar check",
    completeBtn.querySelector(".btn-label").textContent === "Mark lesson complete" &&
    !completeBtn.classList.contains("is-complete") && tokensCheck.hidden === true);

  // A 3D canvas created while its lesson was hidden must get a real size
  // when the lesson is shown (view switching re-fires window resize).
  doc.querySelector('.lesson-nav a[href="#embeddings"]').click();
  await sleep(2500);
  const cv = doc.querySelector("#embedCanvas canvas");
  check("embeddings: 3D canvas has non-zero size after showing lesson",
    !!cv && cv.width > 0 && cv.height > 0);
  doc.querySelector('.lesson-nav a[href="#toymodel"]').click();
  await sleep(500);
  const toy = doc.querySelector("#toyCanvas canvas");
  check("toymodel: 3D canvas has non-zero size after showing lesson",
    !!toy && toy.width > 0 && toy.height > 0);
  doc.querySelector('.lesson-nav a[href="#scaling"]').click();
  await sleep(1500);
  const scaleCv = doc.querySelector("#scaleCanvas canvas");
  check("scaling: 3D canvas has non-zero size after showing lesson",
    !!scaleCv && scaleCv.width > 0 && scaleCv.height > 0);

  document.getElementById("out").textContent =
    (failures ? "FAIL (" + failures + ")\n" : "PASS\n") + lines.join("\n");
  document.title = failures ? "FAIL" : "PASS";
});
</script>
